  <link rel="alternate" hreflang="de" href="https://christian-epping.com/de/index.html">

  <link rel="alternate" hreflang="x-default" href="https://christian-epping.com/">

  <title>Christian Epping — Senior UX/UI Designer</title>

  <script>
    (function () {
      try {
        var lang = ((navigator.language || navigator.userLanguage || 'de') + '').toLowerCase();
        var target = lang.indexOf('de') === 0 ? 'de/index.html' : 'en/index.html';
        window.location.replace(target);
      } catch (e) {}
    })();
  </script>

<body class="lang-gate">

  <div class="lang-gate__inner">

    <p class="lang-gate__hint text-base text-light mt-24">
      Bitte Sprache wählen / Please choose your language
    </p>

    <div class="row x-gap-16 y-gap-16 mt-32 justify-content-center hero-cta-row">
      <div class="col-auto">
        <a href="de/index.html" class="button -md -black text-white">Deutsch</a>
      </div>
      <div class="col-auto">
        <a href="en/index.html" class="button -md -outline-black text-black">English</a>
      </div>
    </div>
  </div>
