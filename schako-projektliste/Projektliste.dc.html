<!DOCTYPE html>

<x-dc>

<meta name="ext-resource-dependency" content="assets/project-thumb.png" data-resource-id="projectThumb">

<style>
  html,body{margin:0;padding:0;height:100%}
  body{background:#f9f9f9;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  *{box-sizing:border-box}
  ::selection{background:#ccebde}
  a{color:#006b3e;text-decoration:none}
  a:hover{color:#004d2d;text-decoration:underline}

  .app{
    /* --- SCHAKO Portal tokens --- */
    --fg:#1e1e1e; --fg-emphasis:#1e1e1e; --fg-subtle:#666; --fg-muted:#ccc; --fg-disabled:#6e6e6e;
    --fg-level-2:#4d4d4d; --fg-level-3:#666; --fg-level-5:#999;
    --fg-primary:#007d49; --fg-primary-emphasis:#006b3e; --fg-primary-hover:#004d2d; --fg-primary-active:#003d24;
    --fg-success:#007d49; --fg-warning:#9d5300; --fg-danger:#df0000; --fg-danger-hover:#b40000; --fg-danger-active:#8f0000;
    --bg:#fff; --bg-muted:#f9f9f9;
    --bg-level-1:#f2f2f2; --bg-level-2:#e6e6e6; --bg-level-3:#ccc; --bg-level-4:#b3b3b3; --bg-level-5:#999;
    --bg-elevated:#fff; --bg-hover:#e6e6e6; --bg-active:#ccc;
    --bg-primary:#006b3e; --bg-primary-hover:#004d2d; --bg-primary-active:#003d24;
    --bg-primary-emphasis:#006b3e; --bg-primary-disabled:#aecec1;
    --primary:#007d49; --primary-15:#ccebde; --primary-20:#aecec1;
    --bg-selected:#f0f9f5; --selected-indicator:#006b3e;
    --bg-secondary:#f49f33; --bg-secondary-active:#f18700; --bg-secondary-subtle:#f9cf99; --bg-secondary-muted:#fce7cc;
    --bg-warning:#ffebcc; --bg-danger:#df0000; --bg-danger-disabled:#ffbaba; --bg-success:#009959;
    --bg-green:#ccebde; --bg-blue:#ccebed; --bg-crimson:#eed0e1; --bg-gray:#ccc;
    --divider:#ccc; --divider-subtle:#e6e6e6; --border-color-elevated:#e6e6e6;
    --border-radius-2:0.125rem; --border-radius-4:0.25rem; --border-radius-8:0.5rem;
    --shadow-level-1:0 2px 8px rgba(0,0,0,.08);
    --shadow-level-2:0 6px 24px rgba(0,0,0,.10);
    --shadow-level-3:0 10px 40px rgba(0,0,0,.12);
    --rem-space-2:0.125rem; --rem-space-4:0.25rem; --rem-space-8:0.5rem; --rem-space-12:0.75rem;
    --rem-space-16:1rem; --rem-space-20:1.25rem; --rem-space-24:1.5rem; --rem-space-32:2rem;
    --font-size-12:0.75rem; --font-size-14:0.875rem; --font-size-16:1rem;
    --font-size-18:1.125rem; --font-size-20:1.25rem; --font-size-24:1.5rem;
    --font-regular:"calibri-regular",Calibri,Carlito,helvetica,arial,sans-serif;
    --font-bold:"calibri-bold",Calibri,Carlito,helvetica,arial,sans-serif;
    --min-target:44px;
    --animation-duration:300ms; --animation-duration-fast:150ms;
    --rp:var(--rem-space-12); --gp:var(--rem-space-12);
    font-family:var(--font-regular);font-size:var(--font-size-14);color:var(--fg);
    height:100%;display:flex;flex-direction:column;background:var(--bg-muted);overflow:hidden
  }
  .app :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .mono{font-family:var(--font-regular);font-variant-numeric:tabular-nums}
  .code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.1px}
  .font-bold{font-family:var(--font-bold);font-weight:700}

  /* scrollbars */
  .tbl-scroll{scrollbar-width:thin;scrollbar-color:var(--bg-level-3) transparent}
  .tbl-scroll::-webkit-scrollbar{width:12px;height:12px}
  .tbl-scroll::-webkit-scrollbar-track{background:transparent}
  .tbl-scroll::-webkit-scrollbar-thumb{background:var(--bg-level-3);border-radius:var(--border-radius-8);border:3px solid var(--bg)}
  .tbl-scroll::-webkit-scrollbar-thumb:hover{background:var(--bg-level-4)}
  .vscroll{scrollbar-width:thin;scrollbar-color:var(--bg-level-3) transparent}
  .vscroll::-webkit-scrollbar{width:8px}
  .vscroll::-webkit-scrollbar-thumb{background:var(--bg-level-3);border-radius:var(--border-radius-4)}

  /* toolbar buttons */
  .ubtn{display:inline-flex;align-items:center;gap:var(--rem-space-8);min-height:var(--min-target);padding:0 var(--rem-space-16);border-radius:var(--border-radius-8);border:1px solid var(--divider);background:var(--bg);color:var(--fg);font-family:var(--font-regular);font-size:var(--font-size-14);cursor:pointer;transition:background var(--animation-duration-fast),border-color var(--animation-duration-fast),color var(--animation-duration-fast);white-space:nowrap}
  .ubtn:hover{background:var(--bg-level-1);border-color:var(--bg-level-4)}
  .ubtn.on{background:var(--bg-primary);border-color:var(--bg-primary);color:#fff}
  .ubtn.on:hover{background:var(--bg-primary-hover);border-color:var(--bg-primary-hover)}
  .ubtn svg{width:16px;height:16px;flex-shrink:0}
  .primary{background:var(--bg-primary);border-color:var(--bg-primary);color:#fff}
  .primary:hover{background:var(--bg-primary-hover);border-color:var(--bg-primary-hover);color:#fff}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--border-radius-4);border:none;background:none;color:var(--fg-subtle);cursor:pointer;transition:background var(--animation-duration-fast),color var(--animation-duration-fast)}
  .iconbtn:hover{background:var(--bg-level-2);color:var(--fg)}

  /* pill toggle */
  .pill{position:relative;width:34px;height:20px;border-radius:9999px;background:var(--bg-level-3);transition:background var(--animation-duration-fast);flex-shrink:0}
  .pill::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-level-1);transition:transform var(--animation-duration-fast)}
  .ubtn.on .pill{background:rgba(255,255,255,.4)}
  .ubtn.on .pill::after{transform:translateX(14px)}

  /* segmented */
  .seg{display:inline-flex;border:1px solid var(--divider);border-radius:var(--border-radius-8);overflow:hidden;background:var(--bg)}
  .ffloors{display:flex;align-items:stretch;flex:0 0 auto;max-width:0;opacity:0;overflow:hidden;transition:max-width .28s ease,opacity .18s ease}
  .ffloors.open{max-width:640px;opacity:1}
  .ffloors .ftab{flex:0 0 auto}
  .seg.icons button{padding:0;width:44px;min-height:var(--min-target);display:inline-flex;align-items:center;justify-content:center}
  .seg button{border:none;background:none;min-height:var(--min-target);padding:0 var(--rem-space-16);font-family:var(--font-regular);font-size:var(--font-size-14);color:var(--fg-subtle);cursor:pointer;transition:background var(--animation-duration-fast),color var(--animation-duration-fast)}
  .seg button+button{border-left:1px solid var(--divider-subtle)}
  .seg button.on{background:var(--bg-primary);color:#fff;font-family:var(--font-bold);font-weight:700}
  .seg button:not(.on):hover{background:var(--bg-level-1);color:var(--fg)}

  /* search */
  .search{display:flex;align-items:center;gap:var(--rem-space-8);min-height:var(--min-target);padding:0 var(--rem-space-12);border-radius:var(--border-radius-8);border:1px solid var(--divider);background:var(--bg);flex:1 1 120px;min-width:104px;max-width:520px;transition:border-color var(--animation-duration-fast)}
  .search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-15)}
  .search svg{width:16px;height:16px;color:var(--fg-subtle);flex-shrink:0}
  .search input{border:none;outline:none;background:none;flex:1;font-family:var(--font-regular);font-size:var(--font-size-14);color:var(--fg)}
  .search input::placeholder{color:var(--fg-level-2)}

  /* filter bar */
  .fbar{flex-shrink:0;display:flex;align-items:center;gap:var(--rem-space-8);flex-wrap:wrap;padding:var(--rem-space-12) var(--rem-space-16);background:var(--bg-level-1);border-bottom:1px solid var(--divider-subtle)}
  .fbar-label{font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-12);color:var(--fg-subtle)}
  .chip{display:inline-flex;align-items:center;gap:var(--rem-space-4);min-height:32px;padding:var(--rem-space-2) var(--rem-space-4) var(--rem-space-2) var(--rem-space-12);border-radius:var(--border-radius-4);background:var(--primary-15);border:1px solid var(--primary-20);color:var(--fg-primary-emphasis);font-size:var(--font-size-14);white-space:nowrap}
  .chip.sortchip{background:var(--bg-blue);border-color:#a7d8dd;color:var(--fg)}
  .chip-x{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:none;background:none;color:currentColor;opacity:.7;cursor:pointer;border-radius:var(--border-radius-2);padding:0}
  .chip-x:hover{opacity:1;background:rgba(0,0,0,.08)}
  .chip-x svg{width:12px;height:12px}
  .resetbtn{margin-left:auto;display:inline-flex;align-items:center;gap:var(--rem-space-8);min-height:32px;padding:0 var(--rem-space-12);border-radius:var(--border-radius-4);border:1px solid var(--bg-primary);background:var(--bg-primary);color:#fff;font-family:var(--font-regular);font-size:var(--font-size-14);cursor:pointer;transition:background var(--animation-duration-fast)}
  .resetbtn:hover{background:var(--bg-primary-hover);border-color:var(--bg-primary-hover)}
  .resetbtn svg{width:14px;height:14px}

  /* table */
  .tbl-scroll{flex:1;overflow:auto;background:var(--bg)}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--bg)}
  thead th{position:sticky;top:0;z-index:20;background:var(--bg);padding:0;height:var(--min-target);text-align:left;border-bottom:1px solid var(--divider);user-select:none}
  thead th.stik{z-index:30}
  .th-in{display:flex;align-items:center;gap:var(--rem-space-4);height:var(--min-target);padding:0 var(--rem-space-12);font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-12);letter-spacing:.4px;text-transform:uppercase;color:var(--fg-subtle);overflow:hidden}
  .th-in.sortable{cursor:pointer}
  .th-in.sortable:hover{color:var(--fg);background:var(--bg-level-1)}
  .th-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sort-ind{display:flex;flex-direction:column;line-height:0;color:var(--bg-level-4);flex-shrink:0}
  .sort-ind svg{width:11px;height:11px;display:block}
  .sort-ind .up.on,.sort-ind .dn.on{color:var(--fg-primary)}
  .th-in.active .th-label{color:var(--fg-primary-emphasis)}
  .fdot{width:6px;height:6px;border-radius:50%;background:var(--fg-primary);flex-shrink:0}
  .resz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:2}
  .resz:hover,.resz.act{background:linear-gradient(90deg,transparent,var(--primary))}

  td{padding:var(--rp) var(--rem-space-12);border-bottom:1px solid var(--divider-subtle);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg)}
  .stik{position:sticky;background:var(--bg)}
  tbody .stik{z-index:6}
  .dr td{cursor:pointer;transition:background var(--animation-duration-fast)}
  .dr.even td{background:var(--bg-level-1)}
  .dr:hover td{background:var(--bg-level-2)}
  .dr.sel td{background:var(--bg-selected)}
  .dr.sel td.stik.first{box-shadow:inset 2px 0 0 0 var(--selected-indicator)}
  .dr.sel:hover td{background:var(--primary-15)}

  /* group row */
  .gr td{background:var(--bg-level-1);cursor:pointer;padding:var(--gp) var(--rem-space-12);border-bottom:1px solid var(--divider-subtle);border-top:1px solid var(--divider-subtle)}
  .gr:hover td{background:var(--bg-level-2)}
  .grp-label{display:flex;align-items:center;gap:var(--rem-space-8);font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-16);color:var(--fg)}
  .grp-icon{display:flex;color:var(--fg-primary)}
  .grp-icon svg{width:16px;height:16px}
  .grp-pos{font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-14);color:var(--fg-subtle);font-variant-numeric:tabular-nums}
  .grp-sep{color:var(--bg-level-3)}
  .grp-badge{display:inline-flex;align-items:center;height:22px;padding:0 var(--rem-space-8);border-radius:9999px;background:var(--bg-level-2);color:var(--fg-subtle);font-size:var(--font-size-12)}
  .chev{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:none;color:var(--fg-subtle);cursor:pointer;border-radius:var(--border-radius-4);transition:background var(--animation-duration-fast),color var(--animation-duration-fast)}
  .chev:hover{background:var(--bg-level-3);color:var(--fg)}
  .chev svg{width:16px;height:16px;transition:transform var(--animation-duration-fast)}
  .chev.closed svg{transform:rotate(-90deg)}
  .hxbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--divider);background:var(--bg);color:var(--fg-subtle);border-radius:var(--border-radius-4);cursor:pointer;font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-16);line-height:1;transition:background var(--animation-duration-fast),color var(--animation-duration-fast),border-color var(--animation-duration-fast)}
  .hxbtn:hover{background:var(--bg-level-2);color:var(--fg);border-color:var(--bg-level-4)}

  /* checkbox */
  .cb{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:var(--border-radius-2);border:1px solid var(--fg-level-5);background:var(--bg);flex-shrink:0;transition:background var(--animation-duration-fast),border-color var(--animation-duration-fast);cursor:pointer}
  .cb.checked,.cb.ind{background:var(--bg-primary);border-color:var(--bg-primary);color:#fff}
  .cb svg{width:12px;height:12px}
  .cb-slot{opacity:.45;transition:opacity var(--animation-duration-fast)}
  .dr:hover .cb-slot,.dr.sel .cb-slot{opacity:1}

  /* cells */
  .c-name{font-size:var(--font-size-14);font-family:var(--font-bold);font-weight:700;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
  .c-num{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
  .c-config{display:flex;align-items:center;gap:var(--rem-space-8);overflow:hidden}
  .c-config .txt{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:var(--font-size-12);color:var(--fg-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .copybtn{opacity:0;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--divider-subtle);border-radius:var(--border-radius-4);background:var(--bg);color:var(--fg-subtle);cursor:pointer;transition:opacity var(--animation-duration-fast),color var(--animation-duration-fast),border-color var(--animation-duration-fast)}
  .dr:hover .copybtn{opacity:1}
  .copybtn:hover{color:var(--fg-primary-emphasis);border-color:var(--primary-20)}
  .copybtn svg{width:12px;height:12px}
  .badge{display:inline-flex;align-items:center;height:24px;padding:0 var(--rem-space-8);border-radius:var(--border-radius-4);font-size:var(--font-size-12);white-space:nowrap}
  .b-zu{background:var(--bg-green);color:var(--fg)}
  .b-ab{background:var(--bg-blue);color:var(--fg)}
  .b-pg{background:var(--bg-level-1);color:var(--fg-subtle);border:1px solid var(--divider-subtle);font-variant-numeric:tabular-nums}
  .b-klr{background:var(--bg-warning);color:var(--fg-warning)}
  .muted{color:var(--fg-level-5)}
  .st{display:inline-flex}
  .st.ok{color:var(--fg-success)}
  .st.warn{color:var(--fg-warning)}
  .st svg{width:20px;height:20px}
  .dl{display:inline-flex;align-items:center;gap:var(--rem-space-4);height:28px;padding:0 var(--rem-space-8);border:1px solid var(--divider-subtle);background:var(--bg);border-radius:var(--border-radius-4);color:var(--fg-subtle);font-size:var(--font-size-12);cursor:pointer;transition:color var(--animation-duration-fast),border-color var(--animation-duration-fast),background var(--animation-duration-fast)}
  .dl:hover{color:var(--fg-primary-emphasis);border-color:var(--primary-20);background:var(--bg-selected)}
  .dl svg{width:12px;height:12px}
  .dlwrap{display:flex;gap:var(--rem-space-4)}

  /* empty */
  .empty{display:flex;flex-direction:column;align-items:center;gap:var(--rem-space-12);padding:var(--rem-space-32) var(--rem-space-20);color:var(--fg-subtle)}
  .empty svg{width:40px;height:40px;color:var(--bg-level-4)}
  .empty .t{font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-16);color:var(--fg)}
  .empty button{margin-top:var(--rem-space-4)}
  .empty .emptybtn svg{width:14px;height:14px}
  td.emptycell{position:sticky;left:0;padding:0;border-bottom:none;height:var(--vh,420px)}
  td.emptycell>.empty{width:var(--vw,100%);height:var(--vh,420px);justify-content:center;padding:0;box-sizing:border-box}

  /* selection bar */
  .selbar{position:fixed;left:50%;bottom:var(--rem-space-24);transform:translateX(-50%);display:flex;align-items:center;gap:var(--rem-space-12);padding:var(--rem-space-8) var(--rem-space-8) var(--rem-space-8) var(--rem-space-16);background:var(--bg-elevated);border:1px solid var(--border-color-elevated);border-radius:var(--border-radius-8);box-shadow:var(--shadow-level-3);color:var(--fg);z-index:60;animation:selIn var(--animation-duration) cubic-bezier(.2,.8,.3,1)}
  @keyframes selIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  .selbar .cnt{font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-14);white-space:nowrap;color:var(--fg)}
  .selbar .sep{width:1px;height:24px;background:var(--divider-subtle)}
  .sela{display:inline-flex;align-items:center;gap:var(--rem-space-8);min-height:var(--min-target);padding:0 var(--rem-space-12);border-radius:var(--border-radius-4);border:1px solid var(--divider);background:var(--bg);color:var(--fg);font-family:var(--font-regular);font-size:var(--font-size-14);cursor:pointer;transition:background var(--animation-duration-fast),color var(--animation-duration-fast),border-color var(--animation-duration-fast)}
  .sela:hover{background:var(--bg-level-1);border-color:var(--bg-level-4)}
  .sela.danger{color:var(--fg-danger)}
  .sela.danger:hover{background:var(--bg-danger-disabled);border-color:var(--fg-danger);color:var(--fg-danger-active)}
  .sela svg{width:16px;height:16px}
  .selx{display:inline-flex;align-items:center;justify-content:center;width:var(--min-target);height:var(--min-target);border-radius:var(--border-radius-4);border:none;background:none;color:var(--fg-subtle);cursor:pointer}
  .selx:hover{background:var(--bg-level-2);color:var(--fg)}
  .selx svg{width:16px;height:16px}

  /* panels */
  .panel{position:fixed;z-index:400;background:var(--bg-elevated);border:1px solid var(--border-color-elevated);border-radius:var(--border-radius-8);box-shadow:var(--shadow-level-2);animation:popIn var(--animation-duration-fast) ease}
  @keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .panel-head{padding:var(--rem-space-12) var(--rem-space-16) var(--rem-space-8);font-family:var(--font-bold);font-weight:700;font-size:var(--font-size-12);letter-spacing:.4px;text-transform:uppercase;color:var(--fg-subtle)}
  .psec+.psec{border-top:1px solid var(--divider-subtle)}
  .psec{padding:var(--rem-space-4) 0}
  .pbtn{display:flex;align-items:center;gap:var(--rem-space-12);width:100%;min-height:var(--min-target);padding:var(--rem-space-8) var(--rem-space-16);border:none;background:none;color:var(--fg);font-family:var(--font-regular);font-size:var(--font-size-14);cursor:pointer;text-align:left;transition:background var(--animation-duration-fast)}
  .pbtn:hover{background:var(--bg-level-1)}
  .pbtn.on{color:var(--fg-primary-emphasis);font-family:var(--font-bold);font-weight:700}
  .pbtn svg{width:16px;height:16px;flex-shrink:0}
  .psearch{margin:var(--rem-space-8) var(--rem-space-12);display:flex;align-items:center;gap:var(--rem-space-8);min-height:36px;padding:0 var(--rem-space-8);border:1px solid var(--divider);border-radius:var(--border-radius-4)}
  .psearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-15);outline:none}
  .psearch svg{width:14px;height:14px;color:var(--fg-subtle)}
  .psearch input{border:none;outline:none;flex:1;font-family:var(--font-regular);font-size:var(--font-size-14);background:none;color:var(--fg)}
  .psearch input::placeholder{color:var(--fg-level-2)}

    const fixed=[
      {phase:'Ausschreibung / Angebot',role:'Administrator',days:62,by:'Christian Epping'},
      {phase:'Planung',role:'Administrator',days:60,by:'Christian Epping'},
      {phase:'Planung',role:'Administrator',days:64,by:'Christian Epping'},
      {phase:'Ausführung',role:'Administrator',days:61,by:'Christian Epping'},
      {phase:'Planung',role:'Mitwirkender',days:11,by:'Yannick Frühwirt',shared:true}
    ];
    const by=['Christian Epping','Yannick Frühwirt','Alexander Bacher','Sandra Keller'];
    this._pd=names.map((n,i)=>{
      const f=fixed[i];
      return {
        id:'p'+i, name:n,

  ago(d){
    if(d<1) return 'Heute';
    if(d<30) return 'Vor '+d+' Tag'+(d===1?'':'en');
    const m=Math.round(d/30.5);
    if(m<12) return 'Vor '+m+' Monat'+(m===1?'':'en');
    const y=Math.floor(m/12);
    return 'Vor '+y+' Jahr'+(y===1?'':'en');
  }

  roomData(g){
    const seed=[...String(g.id+g.name)].reduce((s,c)=>s+c.charCodeAt(0),0);
    const n=String(g.name||'').toLowerCase();
    const MAP=[
      [/konferenz|besprechung|meeting/,'Besprechungsraum',10],
      [/büro|buero|office/,'Büro (Mehrpersonen)',8],
      [/server/,'Serverraum',0],
      [/technik|zentrale|lager/,'Technikraum',2],
      [/flur|erschließung|erschliessung|treppe|gang/,'Verkehrsfläche',0],
      [/aufenthalt|kantine|pause|cafeteria|gastro/,'Aufenthaltsraum',16],
      [/labor/,'Labor',6],
      [/sanitär|wc|bad/,'Sanitärraum',0],
      [/schul|klasse|hörsaal|seminar/,'Unterrichtsraum',24]
    ];
    const hit=MAP.find(([re])=>re.test(n));
    const uses=['Besprechungsraum','Büro (Mehrpersonen)','Technikraum','Verkehrsfläche','Aufenthaltsraum'];
    const pers=[10,8,2,0,16];
    return {
      nutzung:hit?hit[1]:uses[seed%uses.length],
      personen:hit?hit[2]:pers[seed%pers.length],
      lpsM2:(seed%3)+1,
      lpsPerson:[ '1,5','2,0','2,5' ][seed%3],
      flaeche:seed%4===0?'–':((seed%40)+18)+' m²',
      hoehe:['2,5 m','2,8 m','3,0 m'][seed%3],
      schall:['≤ 35 dB(A)','≤ 40 dB(A)','≤ 45 dB(A)'][seed%3]
    };
  }

  segLabels(cfg){
    const F=[
      [/^(DQJ|DQF|DO|DQ)/,['Typ','Ausführung','Lamellenbild','Luftführung','Frontplattengröße','Werkstoff','Farbe Frontplatte','Farbton Sonderfarbe','Oberfläche','Farbe Rahmen','Befestigung','Montageart','Messstutzen','Sensorik','Dichtung','Anschlussstutzen','Beipack']],
      [/^BK/,['Typ','Bauform','Nenngröße','Baulänge','Gehäuseoption','Auslöseeinrichtung','Antrieb','Endschalter','Auslösetemperatur','Bauart','Zubehör','Revision','Sonderausführung']],
      [/^(VHPR|VR)/,['Typ','Nenngröße','Variante','Ausführung','Regelbereich','Volumenstrom min','Volumenstrom max','Klappenantrieb','Sensorik','Nachbehandlung','Bauform','Revision']],
      [/^(PIANO|DSQ|DSR|DS)/,['Typ','Ausführung','Nenngröße','Baulänge','Anschluss','Kulissenmaterial','Option','Sonderausführung']],
      [/^(ALG|WGI|ÜLG|LG)/,['Typ','Ausführung','Form','Lamellenreihen','Breite','Höhe','Rahmen','Farbe Lamellen','Anschluss','Farbton','Befestigung','Zubehör']],
      [/^WDA/,['Typ','Ausführung','Nenngröße','Sonderausführung','Farbton','Düsenstellung','Rahmen','Befestigung','Beipack','Drallverstellung','Einbaurahmen','Anschluss','Zubehör']],
      [/^MA/,['Typ','Baugröße','Drehrichtung','Spannung','Signal','Signalbereich','Funktion','Schutzart']]
    ];
    for(const [re,l] of F) if(re.test(cfg)) return l;
    return [];
  }

  segText(code,label,idx){
    const D={Q:'quadratische Frontplatte (Standard)',R:'runde Frontplatte',SR:'kreisförmig (Standard)',SQ:'quadratisch',Z:'Zuluft (Standard)',A:'Abluft',SB:'Stahlblech (Standard)','9010':'Reinweiß RAL 9010','000':'ohne Sonderfarbe',PT:'pulverbeschichtet',B:'Bandmontage',SM:'Schraubmontage',VM:'Verdeckte Montage',M0:'ohne Messstutzen',SN:'ohne Sensorik',DO:'ohne Dichtung',AO:'ohne Anschlussstutzen',BO:'ohne Beipack',GV:'galvanisiert',AL:'Aluminium',AB:'Absorbermaterial Standard',SV:'Schmelzlot-Auslösung',N:'ohne Rahmen',WS:'Wandeinbau',EC:'EC-Antrieb',NA:'ohne Nachbehandlung',KA0:'ohne Klappenantrieb',DS0:'ohne Drucksensor',F:'Federrücklauf',IP54:'Schutzart IP54'};
    const d=D[code];
    if(d) return d;
    if(/^\d{3,4}$/.test(code)&&/größe|breite|höhe|länge|nenngröße/i.test(label||'')) return code+' mm';
    return code;
  }

  delOne(id){ this.ROWS=this.ROWS.filter(r=>r.id!==id); this.selected.delete(id); if(this.state.activeId===id){ const f=this.items()[0]; this.setState({activeId:f?f.id:null}); } else this.up(); this.toast('Position gelöscht'); }

  renderScope(){
    const cur=this.state.floor;
    if(cur!=='every'&&cur!=='all') return null;
    const isProd=cur==='every';
    const val=isProd?(this.state.prodScope||'all'):(this.state.roomScope||'assigned');
    const opts=isProd?[['all','Alle Produkte'],['assigned','Zugeordnet'],['unassigned','Nicht zugeordnet']]
                     :[['all','Alle Räume'],['assigned','Zugeordnet'],['unassigned','Nicht zugeordnet']];
    const set=k=>this.setState(isProd?{prodScope:k,scopeOpen:false}:{roomScope:k,scopeOpen:false});
    const label=(opts.find(o=>o[0]===val)||opts[0])[1];
    if(this.state.tbNarrow) return h('div',{style:{position:'relative',marginLeft:9}},
      h('button',{className:'ubtn'+(val!==opts[0][0]?' on':''),'data-scope-trigger':'1',onClick:()=>this.setState({scopeOpen:!this.state.scopeOpen})},
        this.icon('funnel',15),label,h('span',{className:'chevr'+(this.state.scopeOpen?' up':'')},this.icon('chevDown',13,2.5))),
      this.state.scopeOpen?h('div',{className:'panel','data-scope-panel':'1',style:{position:'absolute',top:'calc(100% + 6px)',left:0,width:220,padding:'6px 0',zIndex:60}},
        opts.map(([k,l])=>h('button',{key:k,className:'pbtn',style:k===val?{color:'var(--primary)',fontWeight:600}:null,onClick:()=>set(k)},l))):null);
    return h('div',{className:'seg',style:{marginLeft:9}},
      opts.map(([k,l])=>h('button',{key:k,className:val===k?'on':'',onClick:()=>set(k)},l)));
  }

  renderToolbar(){
    const total=this.items().length;
    const shown=this.filteredItems().length;
    const cur=this.state.floor;
    const tight=this.state.tbTight&&!this.state.searchOpen&&!this.state.search;
    return h('div',{ref:this.tbRef,style:{flexShrink:0,display:'flex',alignItems:'center',flexWrap:'nowrap',gap:'10px 16px',padding:'0 var(--rem-space-4)',minWidth:0}},
      tight
        ?h('button',{className:'ubtn',title:'Suchen','aria-label':'Suchen',style:{width:'var(--min-target)',padding:0,justifyContent:'center',flex:'0 0 auto'},onClick:()=>{ this.setState({searchOpen:true}); setTimeout(()=>{ const i=this.tbRef.current&&this.tbRef.current.querySelector('.search input'); if(i) i.focus(); },60); }},this.icon('search',16))
        :h('div',{className:'search'},
          this.icon('search',16),
          h('input',{value:this.state.search,placeholder:this.state.tbNarrow?'Suchen …':'Name, Bestellschlüssel, Produktkategorie suchen …',onChange:e=>this.setState({search:e.target.value}),onBlur:()=>{ if(!this.state.search) this.setState({searchOpen:false}); }}),
          this.state.search&&h('button',{className:'iconbtn',title:'Leeren',onClick:()=>this.setState({search:'',searchOpen:false})},this.icon('x',14))),
      this.renderScope(),
      h('div',{style:{display:'flex',alignItems:'center',gap:9,marginLeft:'auto'}},
        (this.state.floor!=='every'&&this.state.floor!=='up')&&h('button',{className:'ubtn'+(this.state.showHierarchy?' on':''),title:'Raumstruktur ein-/ausblenden',onClick:()=>this.setState({showHierarchy:!this.state.showHierarchy})},
          this.icon('box',15),'Raumstruktur',h('span',{className:'pill'})),
        h('div',{className:'seg icons'},
          h('button',{className:this.state.density==='comfortable'?'on':'',title:'Komfort','aria-label':'Komfort',onClick:()=>this.setState({density:'comfortable'})},this.icon('rowsComfort',16)),
          h('button',{className:this.state.density==='compact'?'on':'',title:'Kompakt','aria-label':'Kompakt',onClick:()=>this.setState({density:'compact'})},this.icon('rowsCompact',16))),
        h('button',{className:'ubtn'+(this.state.detailOpen!==false?' on':''),title:this.state.detailOpen!==false?'Detailansicht ausblenden':'Detailansicht einblenden','aria-label':'Detailansicht','aria-pressed':this.state.detailOpen!==false,onClick:()=>this.setState({detailOpen:this.state.detailOpen===false})},this.icon('panelRight',15)),
        h('button',{className:'ubtn'+(this.state.fullscreen?' on':''),title:this.state.fullscreen?'Vollbild verlassen':'Vollbild','aria-label':'Vollbild','aria-pressed':!!this.state.fullscreen,onClick:()=>this.setState({fullscreen:!this.state.fullscreen})},this.icon(this.state.fullscreen?'shrink':'expand',15)),
        h('button',{className:'ubtn','data-col-trigger':'1',title:'Spalten','aria-label':'Spalten',onClick:e=>{ const r=e.currentTarget.getBoundingClientRect(); this.setState({colPanelOpen:!this.state.colPanelOpen,sfPanelOpen:false,anchor:Object.assign(this.anchorFrom(r,8,420),{right:window.innerWidth-r.right})}); }},
          this.icon('columns',15),h('span',{className:'chevr'+(this.state.colPanelOpen?' up':'')},this.icon('chevDown',13,2.5)))));
  }

  renderFilterBar(){
    if(!this.isActive()) return null;
    const chips=[];
    if(this.state.sortKey){ const col=this.cols.find(c=>c.key===this.state.sortKey); chips.push(
      h('span',{className:'chip sortchip',key:'sort'}, (this.state.sortDir==='asc'?'↑ ':'↓ ')+(col?col.label:''),
        h('button',{className:'chip-x',onClick:()=>this.setSort(null,null)},this.icon('x',11,3)))); }
    if(this.state.search.trim()) chips.push(
      h('span',{className:'chip',key:'q',style:{background:'#f3f0fa',borderColor:'#e0d6f0',color:'#6a4bb0'}}, '„'+this.state.search.trim()+'"',
        h('button',{className:'chip-x',onClick:()=>this.setState({search:''})},this.icon('x',11,3))));
    this.activeFilters.forEach((vals,key)=>{ const col=this.cols.find(c=>c.key===key); vals.forEach(v=>chips.push(
      h('span',{className:'chip',key:key+v}, (col?col.label:key)+': '+v,
        h('button',{className:'chip-x',onClick:()=>this.removeFilter(key,v)},this.icon('x',11,3))))); });
    return h('div',{className:'fbar'},
      h('span',{className:'fbar-label'},'Aktiv'), chips,
      h('button',{className:'resetbtn',onClick:()=>this.resetAll()},this.icon('reset',13),'Zurücksetzen'));
  }

  renderTableArea(){
    const vc=this.visCols();
    const totalW=CB_W+CHV_W+vc.reduce((s,c)=>s+c.width,0);
    return h('div',{className:'tbl-scroll'+(this.state.floor==='all'?' nodrag':''),ref:el=>{ if(el){ el.style.setProperty('--vw',el.clientWidth+'px'); el.style.setProperty('--vh',Math.max(240,el.clientHeight-44)+'px'); } }},
      h('table',{style:{width:totalW+'px',minWidth:'100%'}},
        h('colgroup',null,
          h('col',{style:{width:CB_W+'px'}}), h('col',{style:{width:CHV_W+'px'}}),
          ...vc.map(c=>h('col',{key:c.key,style:{width:c.width+'px'}}))),
        this.renderHead(vc), this.renderBody(vc)));
  }

  renderHead(vc){
    const list=this.currentList();
    const allChk=list.length>0&&list.every(r=>this.selected.has(r.id));
    const someChk=!allChk&&list.some(r=>this.selected.has(r.id));
    return h('thead',null, h('tr',null,
      h('th',{className:'stik',style:{left:0,width:CB_W}},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:44},title:'Alle auswählen',
          onClick:()=>{ if(allChk) this.selected.clear(); else list.forEach(r=>this.selected.add(r.id)); this.up(); }},
          this.cb(allChk?'checked':someChk?'ind':''))),
      h('th',{className:'stik',style:{left:CB_W,width:CHV_W}},
        !this.isFlat()?h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:3,height:44}},
          h('button',{className:'hxbtn',title:'Alle einklappen',onClick:()=>{ this.groups().forEach(g=>this.groupOpen[g.id]=false); this.up(); }},'−'),
          h('button',{className:'hxbtn',title:'Alle aufklappen',onClick:()=>{ this.groups().forEach(g=>this.groupOpen[g.id]=true); this.up(); }},'+')):null),
      ...vc.map(col=>{
        const sorted=this.state.sortKey===col.key;
        const filtered=(this.activeFilters.get(col.key)||new Set()).size>0;
        const numeric=col.key==='qty'||col.key==='einzelpreis'||col.key==='gesamtpreis';
        return h('th',{key:col.key,style:{position:'sticky',top:0}},
          h('div',{className:'th-in'+(col.sortable?' sortable':'')+(sorted||filtered?' active':''),
            style:numeric?{justifyContent:'flex-end'}:null,
            onClick:col.sortable?(e)=>{ const th=e.currentTarget.closest('th'); const r=th.getBoundingClientRect(); this.setState({sfPanelOpen:!(this.state.sfPanelOpen&&this.state.sfActiveCol===col.key),sfActiveCol:col.key,sfSearch:'',colPanelOpen:false,anchor:Object.assign(this.anchorFrom(r,2,440),{left:Math.max(8,Math.min(r.left,window.innerWidth-262))})}); }:null,
            'data-sf-head':col.sortable?'1':null},
            h('span',{className:'th-label'},col.label),
            col.sortable&&h('span',{className:'sort-ind'},
              h('span',{className:'up'+(sorted&&this.state.sortDir==='asc'?' on':'')},this.icon('arrUp',11,3)),
              h('span',{className:'dn'+(sorted&&this.state.sortDir==='desc'?' on':'')},this.icon('arrDown',11,3))),
            filtered&&h('span',{className:'fdot'})),
          h('div',{className:'resz'+(this.resizeCol===col?' act':''),onMouseDown:e=>{ e.preventDefault(); e.stopPropagation(); this.resizeCol=col; this.resizeStartX=e.clientX; this.resizeStartW=col.width; document.body.style.cursor='col-resize'; this.up(); }}));
      })));
  }

  renderBody(vc){
    const rows=[];
    if(this.isFlat()){
      const list=this.sortedItems();
      if(!list.length) return h('tbody',null,this.emptyRow(vc));
      list.forEach((r,i)=>rows.push(this.dataRow(r,vc,false,i)));
    } else {
      const visible=new Set(this.filteredItems().map(r=>r.id));
      let idx=0;
      this.ROWS.forEach(r=>{
        if(r.type==='group'){ if(this.ROWS.some(x=>x.type==='item'&&x.parent===r.id&&visible.has(x.id))) rows.push(this.groupRow(r,vc)); }
        else { if(!visible.has(r.id)) return; if(!this.groupOpen[r.parent]) return; rows.push(this.dataRow(r,vc,true,idx++)); }
      });
      if(!rows.length) return h('tbody',null,this.emptyRow(vc));
    }
    return h('tbody',null,rows);
  }

  emptyRow(vc){
    return h('tr',{key:'empty'},h('td',{colSpan:vc.length+2,className:'emptycell',style:{background:'#fff'}},
      h('div',{className:'empty'},this.icon('search',38,1.5),
        h('div',{className:'t'},'Keine Positionen gefunden'),
        h('div',null,'Passen Sie Suche oder Filter an.'),
        h('button',{className:'ubtn emptybtn',onClick:()=>this.resetAll()},this.icon('reset',13),'Filter zurücksetzen'))));
  }

  groupRow(row,vc){
    const open=this.groupOpen[row.id];
    const kids=this.ROWS.filter(r=>r.type==='item'&&r.parent===row.id);
    const vis=kids.filter(r=>this.filteredItems().some(f=>f.id===r.id));
    const allSel=vis.length>0&&vis.every(r=>this.selected.has(r.id));
    const someSel=!allSel&&vis.some(r=>this.selected.has(r.id));
    return h('tr',{className:'gr'+(this.state.activeId===row.id?' gact':'')+(this.state.dropGroup===row.id?' drop':'')+(this.state.dropAt&&this.state.dropAt.group&&this.state.dropAt.id===row.id?' drop-'+this.state.dropAt.where:'')+(this.dragGroupId===row.id?' dragging':''),key:row.id,'data-row':row.id,title:'Ziehen, um den Raum in ein Geschoss zu verschieben',onMouseDown:e=>this.pointerDown(row,e),onClick:()=>{ if(this.justDragged){ this.justDragged=false; return; } this.setState({activeId:row.id,detailTab:'raumdaten'}); }},
      h('td',{className:'stik',style:{left:0}},
        h('div',{style:{display:'flex',justifyContent:'center'},title:'Ganzen Raum auswählen',
          onClick:e=>{ e.stopPropagation(); vis.forEach(r=>{ if(allSel) this.selected.delete(r.id); else this.selected.add(r.id); }); this.up(); }},
          this.cb(allSel?'checked':someSel?'ind':''))),
      h('td',{className:'stik',style:{left:CB_W}},
        h('div',{style:{display:'flex',justifyContent:'center'}},
          h('button',{className:'chev'+(open?'':' closed'),onClick:e=>{ e.stopPropagation(); this.groupOpen[row.id]=!open; this.up(); }},this.icon('chevDown',15,2.5)))),
      h('td',{colSpan:vc.length},h('div',{className:'grp-label'},
        h('span',{className:'grp-icon'},this.icon('box',16,1.7)),
        h('span',{className:'grp-pos'},this.pos(row)),
        h('span',{className:'grp-sep'},'·'),
        h('span',null,row.name),
        h('span',{className:'grp-badge'},kids.length))));
  }

  dataRow(row,vc,isChild,idx){
    const sel=this.selected.has(row.id);
    const zebra=this.props.zebra&&idx%2===1;
    return h('tr',{className:'dr'+(sel?' sel':'')+(zebra?' even':'')+(this.state.activeId===row.id?' act':'')+(this.dragIds&&this.dragIds.includes(row.id)?' dragging':'')+(this.state.dropAt&&this.state.dropAt.id===row.id?' drop-'+this.state.dropAt.where:''),key:row.id,onClick:()=>this.setState({activeId:row.id}),
      'data-row':row.id,title:'Ziehen, um zu verschieben oder neu einzusortieren',
      onMouseDown:e=>this.pointerDown(row,e)},
      h('td',{className:'stik first',style:{left:0}},
        h('div',{className:'cb-slot',style:{display:'flex',justifyContent:'center'},onClick:e=>{ e.stopPropagation(); this.toggleSelect(row.id); }},this.cb(sel?'checked':''))),
      h('td',{className:'stik',style:{left:CB_W}}),
      ...vc.map((col,ci)=>{
        const numeric=col.key==='qty'||col.key==='einzelpreis'||col.key==='gesamtpreis';
        return h('td',{key:col.key,className:numeric?'c-num':null,style:ci===0&&isChild?{paddingLeft:22}:null},this.cell(col.key,row));
      }));
  }

  cell(key,row){
    switch(key){
      case 'pos': return h('span',{className:'mono',style:{color:'var(--fg-subtle)',fontSize:'var(--font-size-12)'}},this.pos(row));
      case 'name': return h('div',{className:'c-name',title:row.name},row.name);
      case 'config': return h('div',{className:'c-config'},
        h('span',{className:'txt',title:row.config},row.config),
        h('button',{className:'copybtn',title:'Bestellschlüssel kopieren',onClick:e=>{ e.stopPropagation(); try{navigator.clipboard&&navigator.clipboard.writeText(row.config);}catch(x){} this.toast('Bestellschlüssel kopiert'); }},this.icon('copy',12)));
      case 'qty': return h('span',{className:'mono'},row.qty);
      case 'einzelpreis': return h('span',null,row.einzelpreis);
      case 'gesamtpreis': return h('span',{style:{fontFamily:'var(--font-bold)',fontWeight:700,color:'var(--fg)'}},row.gesamtpreis);
      case 'preisgruppe': return h('span',{className:'badge b-pg'},row.preisgruppe);
      case 'produktgruppe': return h('span',{style:{color:'var(--fg-subtle)',fontSize:'var(--font-size-14)'},title:row.produktgruppe},row.produktgruppe);
      case 'produktkategorie': return h('span',{style:{color:'var(--fg-subtle)',fontSize:'var(--font-size-14)'},title:row.produktkategorie},row.produktkategorie);
      case 'luftstrom':
        if(!row.luftstrom||row.luftstrom==='–') return h('span',{className:'muted'},'–');
        return h('span',{className:'badge '+(row.luftstrom==='Abluft'?'b-ab':'b-zu')},row.luftstrom);
      case 'klaerung': return row.klaerung?h('span',{className:'badge b-klr'},'Offen'):h('span',{className:'muted'},'–');
      case 'status':
        return h('span',{className:'st '+(row.status==='ok'?'ok':'warn'),title:row.status==='ok'?'Vollständig':'Hinweis'},this.icon(row.status==='ok'?'ok':'warn',18,2));
      case 'downloads': return h('div',{className:'dlwrap'},['PDF','DWG','BIM'].map(f=>
        h('button',{key:f,className:'dl',title:f+' herunterladen',onClick:e=>{ e.stopPropagation(); this.toast(f+' wird heruntergeladen'); }},this.icon('download',12),f)));
      default: return null;
    }
  }

  renderSelBar(){
    const n=this.selected.size; if(!n) return null;
    return h('div',{className:'selbar'},
      this.cb('checked'),
      h('span',{className:'cnt'},n+' Position'+(n!==1?'en':'')+' ausgewählt'),
      h('span',{className:'sep'}),
      h('button',{className:'sela',onClick:()=>{ this.dupSel(); }},this.icon('duplicate',14),'Duplizieren'),
      h('button',{className:'sela',onClick:()=>this.toast(n+' Position'+(n!==1?'en':'')+' exportiert')},this.icon('exp',14),'Exportieren'),
      h('button',{className:'sela danger',onClick:()=>{ this.delSel(); }},this.icon('trash',14),'Löschen'),
      h('span',{className:'sep'}),
      h('button',{className:'selx',title:'Auswahl aufheben',onClick:()=>this.clearSel()},this.icon('x',15)));
  }

  renderColPanel(){
    if(!this.state.colPanelOpen||!this.state.anchor) return null;
    const a=this.state.anchor;
    return h('div',{className:'panel','data-col-panel':'1',style:this.panelPos(a,{right:a.right,width:250})},
      h('div',{className:'panel-head'},'Spalten verwalten'),
      h('div',{className:'vscroll',style:{flex:1,minHeight:0,overflowY:'auto',paddingBottom:6}},
        this.cols.map((col,i)=>h('div',{key:col.key,
          className:'colitem'+(col.locked?' locked':''),draggable:!col.locked,
          onDragStart:()=>{ this.dragIdx=i; },
          onDragOver:e=>{ e.preventDefault(); if(this.dragIdx!==null&&this.dragIdx!==i){ e.currentTarget.classList.add('dragover'); } },
          onDragLeave:e=>e.currentTarget.classList.remove('dragover'),
          onDrop:e=>{ e.preventDefault(); e.currentTarget.classList.remove('dragover'); if(this.dragIdx===null||this.dragIdx===i) return; const [m]=this.cols.splice(this.dragIdx,1); this.cols.splice(i,0,m); this.dragIdx=null; this.up(); },
          onClick:()=>{ if(col.locked) return; col.visible=!col.visible; this.up(); }},
          h('span',{className:'grip'},this.icon('grip',15,0)),
          this.cb(col.visible?'checked':''),
          h('span',{className:'col-lbl'},col.label)))));
  }

  renderSfPanel(){
    if(!this.state.sfPanelOpen||!this.state.sfActiveCol||!this.state.anchor) return null;
    const key=this.state.sfActiveCol, a=this.state.anchor;
    const col=this.cols.find(c=>c.key===key);
    let base=this.items();
    this.activeFilters.forEach((vals,k)=>{ if(k!==key&&vals.size) base=base.filter(r=>vals.has(this.getVal(r,k))); });
    let vals=[...new Set(base.map(r=>this.getVal(r,key)).filter(v=>v&&v!=='–'))].sort((x,y)=>x.localeCompare(y,'de'));
    const q=this.state.sfSearch.toLowerCase();
    if(q) vals=vals.filter(v=>v.toLowerCase().includes(q));
    const cur=this.activeFilters.get(key)||new Set();
    return h('div',{className:'panel','data-sf-panel':'1',style:this.panelPos(a,{left:a.left,width:250})},
      h('div',{className:'psec'},
        h('div',{className:'panel-head'},'Sortierung'),
        h('button',{className:'pbtn'+(this.state.sortKey===key&&this.state.sortDir==='asc'?' on':''),onClick:()=>this.setSort(key,'asc')},this.icon('sortAsc',15),'Aufsteigend (A → Z)'),
        h('button',{className:'pbtn'+(this.state.sortKey===key&&this.state.sortDir==='desc'?' on':''),onClick:()=>this.setSort(key,'desc')},this.icon('sortDesc',15),'Absteigend (Z → A)'),
        this.state.sortKey===key&&h('button',{className:'pbtn',style:{color:'var(--fg-subtle)'},onClick:()=>this.setSort(null,null)},this.icon('x',15),'Sortierung aufheben')),
      h('div',{className:'psec',style:{display:'flex',flexDirection:'column',minHeight:0,flex:1}},
        h('div',{className:'panel-head'},'Filtern nach Wert'),
        h('div',{className:'psearch'},this.icon('search',14),h('input',{value:this.state.sfSearch,placeholder:'Suchen …',onChange:e=>this.setState({sfSearch:e.target.value})})),
        vals.length?h('div',{className:'pvals vscroll'},vals.map(v=>{
          const on=cur.has(v);
          return h('div',{key:v,className:'pval'+(on?' checked':''),onClick:()=>this.toggleFilterVal(key,v)},
            this.cb(on?'checked':''),h('span',{className:'lbl',title:v},v));
        })):h('div',{className:'pempty'},'Keine Werte gefunden')));
  }

  renderToast(){ return h('div',{className:'toast'},this.icon('ok',15,2.5),this.state.toast); }
}
</script>
</body>
